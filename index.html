<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>二维码生成器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f2ef;
      --surface: #fcfcfa;
      --fg: #1c1c1a;
      --muted: #5c5a55;
      --line: #e3e1db;
      --accent: #2c333a;
      --accent-fg: #f6f5f2;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }
    h1, h2 { text-wrap: balance; }
    p { text-wrap: pretty; }
    button { font: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    .page {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      padding: 24px 16px max(24px, env(safe-area-inset-bottom));
    }
    .kicker, .label, legend, h2 { font-size: 14px; font-weight: 600; }
    h1 { margin: 4px 0 0; font-size: 32px; font-weight: 560; letter-spacing: -0.02em; }
    h2 { margin: 0; }
    legend { padding: 0; }
    .hint, .meta { margin: 0; color: var(--muted); font-size: 14px; }
    .warn { min-height: 0; }
    .warn:empty { display: none; }
    .split, .actions, .color-row { display: flex; gap: 8px; align-items: center; }
    .split { justify-content: space-between; }
    .actions { flex-wrap: wrap; }
    .field, .swatch, .ghost, .primary, .choice { border: 1px solid var(--line); border-radius: 8px; }
    .field {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      background: var(--surface);
      color: var(--fg);
    }
    textarea.field { min-height: 112px; resize: vertical; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .swatch { width: 44px; height: 44px; padding: 4px; background: var(--surface); flex: none; }
    .slider { width: 100%; height: 44px; accent-color: var(--accent); }
    fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; }
    section { display: grid; gap: 8px; }
    .color { display: grid; gap: 8px; }
    .color-row .field { flex: 1; min-width: 0; }
    .choices { display: grid; gap: 8px; }
    .choice { display: flex; gap: 12px; align-items: center; min-height: 44px; padding: 8px 12px; background: var(--surface); }
    .choice:has(input:checked) { border-color: var(--accent); background: var(--bg); }
    .choice .name { display: block; font-size: 14px; font-weight: 600; }
    .ghost, .primary { min-height: 44px; padding: 0 12px; font-size: 14px; font-weight: 600; }
    .ghost { background: var(--surface); color: var(--fg); }
    .primary { width: 100%; background: var(--accent); color: var(--accent-fg); }
    .primary:disabled { opacity: 0.4; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 24px; display: grid; gap: 8px; }
    .frame { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .square { aspect-ratio: 1; display: grid; place-items: center; }
    .square img { width: 100%; height: 100%; }
    .center { text-align: center; padding: 0 16px; }
    .clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (min-width: 900px) {
      .page { grid-template-columns: 1.3fr 0.7fr; padding: 40px 32px; }
      header, section { grid-column: 1; }
      aside { grid-column: 2; grid-row: 1 / span 3; align-self: start; position: sticky; top: 24px; }
    }
    @media (max-width: 899px) {
      .page { grid-template-columns: 1fr; }
      header { order: 1; }
      section[aria-labelledby] { order: 2; }
      aside { order: 3; }
      section[aria-label] { order: 4; }
      .square { max-width: 256px; margin: 0 auto; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
